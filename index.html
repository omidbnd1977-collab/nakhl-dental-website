<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sabrina Residences</title>
  <meta name="description" content="Sabrina Residences — trusted real estate experts for a smoother, smarter property journey." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Manrope:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="clouds" aria-hidden="true"></div>
    <span class="vline" style="left:4.8%;animation-delay:0s"></span>
    <span class="vline" style="left:35.45%;animation-delay:.1s"></span>
    <span class="vline" style="left:64.7%;animation-delay:.2s"></span>
    <span class="vline" style="left:95.2%;animation-delay:.3s"></span>

    <section class="hero" id="top">
      <img
        class="house"
        src="https://cdn.sceneai.art/Bg%20images/1dd58514-cedb-4f70-9aee-709c3f887808.png"
        alt="Sabrina Residences house"
      />

      <header class="nav">
        <a class="logo nav-in" href="#top" style="animation-delay:.1s" aria-label="Sabrina Residences">
          <svg width="40" height="30" viewBox="0 0 40 30" fill="none" aria-hidden="true">
            <path d="M3 26.5V13.2L20 3.5l17 9.7v13.3" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M15.5 26.5v-8.2h9v8.2" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M8 26.5h24" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </a>

        <nav class="pills" aria-label="Primary">
          <a class="pill pill-home nav-in" href="#top" style="animation-delay:.2s">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            HOME
          </a>
          <a class="pill nav-in" href="#houses" style="animation-delay:.28s">PROPERTIES</a>
          <a class="pill nav-in" href="#houses" style="animation-delay:.36s">AGENT</a>
          <a class="pill nav-in" href="#houses" style="animation-delay:.44s">PARTNER</a>
        </nav>

        <div class="nav-right">
          <div class="lang nav-in" style="animation-delay:.52s" role="group" aria-label="Language">
            <button type="button" data-lang="ba">BA</button>
            <button type="button" data-lang="en" class="is-active">EN</button>
          </div>
          <a class="signin nav-in" href="#top" style="animation-delay:.6s">SIGN IN</a>
          <button class="burger nav-in" id="navToggle" type="button" style="animation-delay:.65s" aria-expanded="false" aria-controls="mobileMenu" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <div class="mobile-menu" id="mobileMenu">
        <a class="pill pill-home" href="#top">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          HOME
        </a>
        <a class="pill" href="#houses">PROPERTIES</a>
        <a class="pill" href="#houses">AGENT</a>
        <a class="pill" href="#houses">PARTNER</a>
      </div>

      <div class="hero-copy">
        <h1>
          <span class="h-line indent"><span class="word w-h1" style="animation-delay:.55s">SABRINA</span></span>
          <span class="h-line"><span class="word w-h1" style="animation-delay:.75s">RESIDENCES</span></span>
          <span class="h-line"><span class="word w-h1" style="animation-delay:.95s">HOUSE</span></span>
        </h1>
        <p class="tagline">
          <span class="tag-line indent">
            <span class="word w-tag" style="animation-delay:1.15s">TRUSTED</span>
            <span class="word w-tag" style="animation-delay:1.21s">REAL</span>
            <span class="word w-tag" style="animation-delay:1.27s">ESTATE</span>
          </span>
          <span class="tag-line">
            <span class="word w-tag" style="animation-delay:1.33s">EXPERTS</span>
            <span class="word w-tag" style="animation-delay:1.39s">FOR</span>
            <span class="word w-tag" style="animation-delay:1.45s">A</span>
            <span class="word w-tag" style="animation-delay:1.51s">SMOOTHER,</span>
            <span class="word w-tag" style="animation-delay:1.57s">SMARTER</span>
          </span>
          <span class="tag-line">
            <span class="word w-tag" style="animation-delay:1.63s">PROPERTY</span>
            <span class="word w-tag" style="animation-delay:1.69s">JOURNEY.</span>
          </span>
        </p>
      </div>

      <div class="explore-wrap">
        <a class="explore word w-explore" href="#houses" style="animation-delay:1.85s">
          EXPLORE PROPERTIES
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>
      </div>

      <aside class="video-card">
        <div class="video-box">
          <video
            id="heroVideo"
            src="https://cdn.sceneai.art/Hero%20Section%20Video/adec243d-ffda-48cf-a8a8-26e6d6bcbe9b.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
          ></video>
        </div>
        <p class="caption">
          <span class="cap-line">
            <span class="word w-cap" style="animation-delay:2.15s">Find</span>
            <span class="word w-cap" style="animation-delay:2.21s">a</span>
            <span class="word w-cap" style="animation-delay:2.27s">home</span>
            <span class="word w-cap" style="animation-delay:2.33s">that</span>
            <span class="word w-cap" style="animation-delay:2.39s">fits</span>
          </span>
          <span class="cap-line">
            <span class="word w-cap" style="animation-delay:2.45s">your</span>
            <span class="word w-cap" style="animation-delay:2.51s">lifestyle</span>
          </span>
        </p>
        <div class="bars" role="tablist" aria-label="Video progress">
          <button type="button" class="bar is-active" data-part="0" aria-label="Part 1"></button>
          <button type="button" class="bar" data-part="1" aria-label="Part 2"></button>
          <button type="button" class="bar" data-part="2" aria-label="Part 3"></button>
          <button type="button" class="bar" data-part="3" aria-label="Part 4"></button>
        </div>
      </aside>
    </section>

    <section class="houses" id="houses">
      <h2>
        <span class="reveal-word" style="animation-delay:0s">OUR</span>
        <span class="reveal-word" style="animation-delay:.15s">LATEST</span>
        <span class="reveal-word" style="animation-delay:.3s">Houses</span>
      </h2>
      <div class="cards">
        <a class="card" href="#houses">
          <img src="https://cdn.sceneai.art/Bg%20images/c789ac4d-f2c8-463a-93f6-1f8c6fa09f9a.png" alt="Latest house one" />
        </a>
        <a class="card" href="#houses">
          <img src="https://cdn.sceneai.art/Bg%20images/bf2e3004-db02-48a1-8e15-c6a58c158b5c.png" alt="Latest house two" />
        </a>
        <a class="card" href="#houses">
          <img src="https://cdn.sceneai.art/Bg%20images/dce07180-2db9-45fe-889a-7a11657c6234.png" alt="Latest house three" />
        </a>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
